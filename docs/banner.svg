<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#22d3ee" fill-opacity="0.85"/>

  <!-- faint network mesh, right-heavy -->
  <g stroke="url(#mesh)" stroke-width="2" fill="none">
    <path d="M820 90 L960 60 L1120 110 L1080 210 L1210 260 L1060 320 L1180 380 L930 360 L860 250 L1000 180 L880 140 Z"/>
    <path d="M960 60 L1000 180 M1120 110 L1080 210 M1000 180 L1060 320 M1080 210 L930 360 M1210 260 L1060 320 M930 360 L1180 380"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.75">
    <circle cx="820" cy="90" r="5"/><circle cx="960" cy="60" r="5"/><circle cx="1120" cy="110" r="5"/>
    <circle cx="1080" cy="210" r="6" filter="url(#glow)"/><circle cx="1210" cy="260" r="5"/>
    <circle cx="1060" cy="320" r="5"/><circle cx="1180" cy="380" r="5"/><circle cx="930" cy="360" r="5"/>
    <circle cx="860" cy="250" r="5"/><circle cx="1000" cy="180" r="5"/><circle cx="880" cy="140" r="5"/>
  </g>
  <circle cx="1080" cy="210" r="11" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- logo mark (reuse of hex mesh emblem) -->
  <g transform="translate(72,138) scale(1.35)">
    <g stroke="#3b5a78" stroke-width="2">
      <line x1="30" y1="30" x2="30" y2="-3"/>
      <line x1="30" y1="30" x2="63" y2="12"/>
      <line x1="30" y1="30" x2="63" y2="48"/>
      <line x1="30" y1="30" x2="30" y2="63"/>
      <line x1="30" y1="30" x2="-3" y2="48"/>
      <line x1="30" y1="30" x2="-3" y2="12"/>
      <line x1="30" y1="-3" x2="63" y2="12"/>
      <line x1="63" y1="12" x2="63" y2="48"/>
      <line x1="63" y1="48" x2="30" y2="63"/>
      <line x1="30" y1="63" x2="-3" y2="48"/>
      <line x1="-3" y1="48" x2="-3" y2="12"/>
      <line x1="-3" y1="12" x2="30" y2="-3"/>
    </g>
    <g fill="#93a7bd">
      <circle cx="30" cy="-3" r="3"/></g>
    <g fill="#93a7bd">
      <circle cx="30" cy="-3" r="3"/><circle cx="63" cy="12" r="3"/><circle cx="63" cy="48" r="3"/>
      <circle cx="30" cy="63" r="3"/><circle cx="-3" cy="48" r="3"/><circle cx="-3" cy="12" r="3"/>
    </g>
    <circle cx="63" cy="48" r="4.5" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="2 2"/>
    <circle cx="30" cy="30" r="9" fill="#0d1526" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="30" cy="30" r="4" fill="#22d3ee" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="205" y="200" font-size="86" font-weight="800" fill="#e8eef6" letter-spacing="2">AETHER<tspan fill="#22d3ee">-NIM</tspan></text>
  <text x="208" y="248" font-size="30" font-weight="500" fill="#93a7bd" letter-spacing="1.2">Autonomous Spectral Network Resilience Twin</text>
  <text x="208" y="290" font-size="20" fill="#6b7f95" letter-spacing="0.6">measure &#8226; detect &#8226; diagnose with Nemotron &#8226; plan deterministically &#8226; verify or roll back</text>

  <!-- chips -->
  <g font-size="19" font-weight="600">
    <g>
      <rect x="207" y="318" width="212" height="40" rx="20" fill="#122030" stroke="#22d3ee" stroke-opacity="0.4"/>
      <text x="313" y="344" text-anchor="middle" fill="#67e8f9">NVIDIA Nemotron</text>
    </g>
    <g>
      <rect x="433" y="318" width="128" height="40" rx="20" fill="#122030" stroke="#34d399" stroke-opacity="0.4"/>
      <text x="497" y="344" text-anchor="middle" fill="#6ee7b7">Tavily Search</text>
    </g>
    <g>
      <rect x="575" y="318" width="230" height="40" rx="20" fill="#122030" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="690" y="344" text-anchor="middle" fill="#a5b4fc">Nebius Token Factory</text>
    </g>
    <g>
      <rect x="819" y="318" width="196" height="40" rx="20" fill="#122030" stroke="#fbbf24" stroke-opacity="0.4"/>
      <text x="917" y="344" text-anchor="middle" fill="#fcd34d">Verified by engine</text>
    </g>
  </g>
</svg>
